# Weekly dependency updates: one grouped pull request per directory for minor and patch versions,
# and a pull request of its own for each major version. CI verifies each one.
#
# The Expo SDK sets the exact versions of the app's packages it knows (expo, expo-*, React, React
# Native and the native libraries in `expo/bundledNativeModules.json`, plus @types/react), and a
# version it doesn't expect can build fine and still crash on a phone. So Dependabot leaves them
# alone entirely: `npx expo install --check` says when they're off, `npx expo install --fix` puts
# them right, and an SDK upgrade moves them together (`npx expo install expo@^<sdk> --fix`;
# CONTRIBUTING.md). TypeScript stays on the line the SDK supports (7 drops the compiler API the
# localization test uses), and native libraries outside the SDK take patches only, because a
# newer minor can need a newer React Native.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: jest-expo
      - dependency-name: eslint-config-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      - dependency-name: react-native-web
      - dependency-name: react-native-webview
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-nitro-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-webrtc
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@config-plugins/react-native-webrtc'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: npm
    directory: /infra/cloudflare
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
